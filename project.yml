name: BedTime

options:
  bundleIdPrefix: tech.sp33c
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: Q2ZG8FQS59
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "14"
    CODE_SIGN_STYLE: Automatic

targets:
  BedTime:
    type: application
    platform: macOS
    sources:
      - path: main.swift
      - path: Store.swift
      - path: Paywall.swift
      - path: Products.storekit
      - path: BedTime.entitlements
    settings:
      base:
        PRODUCT_NAME: BedTime
        PRODUCT_BUNDLE_IDENTIFIER: tech.sp33c.bedtime
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: BedTime
        CODE_SIGN_ENTITLEMENTS: BedTime.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
schemes:
  BedTime:
    build:
      targets:
        BedTime: all
    run:
      config: Debug
  BedTime (StoreKit Test):
    build:
      targets:
        BedTime: all
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
