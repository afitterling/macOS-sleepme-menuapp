name: Lunair

options:
  bundleIdPrefix: tech.sp33c
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: Q2ZG8FQS59
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.2"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic

targets:
  Lunair:
    type: application
    platform: macOS
    sources:
      - path: main.swift
      - path: Lunair.entitlements
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Lunair
        PRODUCT_BUNDLE_IDENTIFIER: tech.sp33c.sleeptimer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lunair
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Lunair sleeps your Mac by asking System Events to sleep when a timer ends."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Lunair.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.2.2"
schemes:
  Lunair:
    build:
      targets:
        Lunair: all
    run:
      config: Debug
